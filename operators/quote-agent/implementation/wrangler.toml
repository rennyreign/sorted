name = "sorted-quote-agent"
main = "src/index.ts"
compatibility_date = "2025-05-15"
compatibility_flags = ["nodejs_compat"]

# Durable Object namespace for quote agents
[[durable_objects.bindings]]
name = "QUOTE_AGENT"
class_name = "QuoteAgent"

# SQLite migration — required for AIChatAgent (message persistence + stream buffering)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuoteAgent"]

# KV for caching GitHub context (optional optimization)
[[kv_namespaces]]
binding = "QUOTE_CACHE"
id = "f0fbba37afc64f60b590972e213cf64f"

# Secrets (set via wrangler secret put)
# GITHUB_TOKEN - classic PAT with repo read access
# OPENAI_API_KEY - optional, for OpenAI instead of Workers AI

[ai]
binding = "AI"


[observability]
enabled = true
head_sampling_rate = 1.0
