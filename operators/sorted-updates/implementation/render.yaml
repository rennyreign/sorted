services:
  - type: web
    name: sorted-updates-api
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    rootDir: operators/sorted-updates/implementation
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gthread --threads=4 --bind=0.0.0.0:$PORT wsgi:application
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SORTED_UPDATES_ENV
        value: production
      - key: SORTED_UPDATES_DEFAULT_CLIENT
        value: gbhalesowen
      - key: SORTED_UPDATES_HTTP_LOGS
        value: "1"
      - key: SORTED_UPDATES_CORS_ORIGINS
        value: "https://graciebarrahalesowen.com,https://www.graciebarrahalesowen.com"
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_WHATSAPP_APP_SECRET
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: rennyreign/gbhalesowen
      - key: NETLIFY_SITE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SORTED_MASTER_EMAIL
        sync: false
