name: Prospect Finder — Nightly Run

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC = 2am–3am UK (BST offset handled separately)
  workflow_dispatch:       # Manual trigger — from GitHub UI or dashboard
    inputs:
      category:
        description: 'Category to search (e.g. "barber shop"). Leave blank for full run.'
        required: false
        default: ''
      location:
        description: 'Location override (e.g. "Birmingham, UK"). Leave blank to use config.'
        required: false
        default: ''

jobs:
  run:
    name: Find new prospects
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: operators/prospect-finder/implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: operators/prospect-finder/implementation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Prospect Finder
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOG_LEVEL: INFO
        run: |
          ARGS=""
          if [ -n "${{ inputs.category }}" ]; then ARGS="$ARGS --query \"${{ inputs.category }}\""; fi
          if [ -n "${{ inputs.location }}" ]; then ARGS="$ARGS --location \"${{ inputs.location }}\""; fi
          eval python main.py $ARGS
