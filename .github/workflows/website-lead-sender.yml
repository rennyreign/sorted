name: Website Lead Sender

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run without sending email'
        required: false
        type: boolean
        default: false
      batch:
        description: 'Maximum website leads to email'
        required: false
        type: string
        default: '10'

jobs:
  send:
    name: Send website lead review links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: operators/website-lead-sender/implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: operators/website-lead-sender/implementation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send lead emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: hello@sortmydigital.site
          FROM_NAME: Sorted
          REVIEW_BASE_URL: https://sortmydigital.site/review/
        run: |
          ARGS="--batch ${{ inputs.batch || '10' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python send.py $ARGS
