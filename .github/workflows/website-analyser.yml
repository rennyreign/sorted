name: Website Analyser — Nightly Run

on:
  schedule:
    - cron: '30 2 * * *'  # 2:30am UTC — runs 30min after Prospect Finder
  workflow_dispatch:       # Manual trigger from GitHub Actions UI

jobs:
  run:
    name: Score unanalysed prospects
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: operators/website-analyser/implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: operators/website-analyser/implementation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Website Analyser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCREENSHOT_API_KEY: ${{ secrets.SCREENSHOT_API_KEY }}
          ANALYSER_MODEL: claude-haiku-4-5-20251001
          LOG_LEVEL: INFO
        run: python main.py --limit 100
