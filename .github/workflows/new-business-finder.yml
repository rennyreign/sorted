name: New Business Finder — Companies House Run

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Incorporation window in days (e.g. 7). Leave blank for default.'
        required: false
        default: ''
      from_date:
        description: 'Incorporation start date (YYYY-MM-DD). Overrides days_back if both provided.'
        required: false
        default: ''
      to_date:
        description: 'Incorporation end date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''
      location:
        description: 'Optional location filter (e.g. "Coventry" or "CV1").'
        required: false
        default: ''
      max_results:
        description: 'Maximum Companies House results to retrieve (default 100, max 5000).'
        required: false
        default: ''

jobs:
  run:
    name: Find new incorporated businesses
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: operators/new-business-finder/implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: operators/new-business-finder/implementation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run New Business Finder
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOG_LEVEL: INFO
        run: |
          ARGS=""
          if [ -n "${{ inputs.days_back }}" ]; then ARGS="$ARGS --days-back ${{ inputs.days_back }}"; fi
          if [ -n "${{ inputs.from_date }}" ]; then ARGS="$ARGS --from-date ${{ inputs.from_date }}"; fi
          if [ -n "${{ inputs.to_date }}" ]; then ARGS="$ARGS --to-date ${{ inputs.to_date }}"; fi
          if [ -n "${{ inputs.location }}" ]; then ARGS="$ARGS --location \"${{ inputs.location }}\""; fi
          if [ -n "${{ inputs.max_results }}" ]; then ARGS="$ARGS --max-results ${{ inputs.max_results }}"; fi
          eval python main.py $ARGS
